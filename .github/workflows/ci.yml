name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 只跑真正会有人用的组合：Linux 跑主流程，Windows 确认路径与 junction 相关逻辑没写歪。
        # ubuntu 钉死版本：`ubuntu-latest` 会在 2026-10-19 迁到 Ubuntu 26，钉住才能让「哪天上游
        # 换了镜像」变成一个我们自己决定的动作，而不是某次 push 突然变红。要升级就改这一行。
        os: [ubuntu-24.04, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 纯单测（不需要 ComfyUI）
        run: npm test

      - name: 假 ctx 冒烟（注册 / schema / render）
        run: npm run smoke

      - name: 假 ctx 路由探针
        run: npm run probe:route

      - name: 打包内容自检
        run: npm pack --dry-run
